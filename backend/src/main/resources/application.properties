spring.application.name=Taberna
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
server.port=${PORT:8080}

# Migraciones de esquema (Flyway)
# baseline-on-migrate permite adoptar una base que ya existia con ddl-auto=update.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Swagger 
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.show-actuator=false

# ImgBB (almacenamiento de imágenes de productos)
imgbb.api.key=93d33db3764db5508c470a30d5014dc2
imgbb.api.url=https://api.imgbb.com/1/upload

